# dsh-notify-chime —— 宿主行
# 工作完成 / 中断 / 出错 / Agent 提问时发声（可另弹系统通知）。
# 这里全部是**初值**：设置页保存过的项以 ~/.dsh/dsh-notify-chime.json 为准。
- insert:
    - id: dsh-notify-chime
      name: 'dsh-notify-chime'
      config:
        # 总开关初值。false 也照常加载插件、照常记账，只是不发声，
        # 这样设置页始终打得开，随时能重新启用。
        enabled: true
        # 同一类事件的最小间隔（去抖），毫秒
        minIntervalMs: 700
        # 是否也为 subagent 子会话发声（默认只提醒你自己的会话）
        includeSubagents: false
        # 音色套初值：default / soft / chime / retro / digital / wood / custom
        soundset: default
        # 每类事件是否发声（设置页可逐类开关，这里只是初值）
        kinds:
          finished: true
          interrupted: true
          error: true
          question: true
        # 系统通知：哪些事件弹、标题前缀、是否带会话名，设置页都能改
        toast:
          enabled: true
          kinds: [ question ]
          includeSession: true
